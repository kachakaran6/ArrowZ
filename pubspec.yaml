name: arrowtapout
description: "ArrowZ — Calm, offline thread-puzzle game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  shared_preferences: ^2.2.3
  in_app_update: ^4.2.3
  in_app_review: ^2.0.9
  audioplayers: ^6.0.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/levels/
    - assets/fonts/
    - assets/audio/

  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
